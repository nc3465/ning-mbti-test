<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ning 的小动物测试</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --text: #1f2430;
      --muted: #5f6f7a;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.55);
      --shadow: 0 24px 70px rgba(20, 60, 80, 0.12);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      background: linear-gradient(135deg, #e6fbff, #dff7ff, #e9fdff, #d7f3ff, #f0feff);
      background-size: 260% 260%;
      animation: softGradientFlow 20s ease-in-out infinite;
    }

    @keyframes softGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hidden { display: none; }

    .fade-out {
      animation: pageFadeOut 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    .fade-in {
      animation: pageFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes pageFadeOut {
      0% { opacity: 1; transform: scale(1); filter: blur(0); }
      100% { opacity: 0; transform: scale(1.015); filter: blur(8px); }
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.99); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .welcome-card,
    .card {
      width: 100%;
      max-width: 760px;
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .welcome-card {
      text-align: center;
      padding: 56px 32px;
      animation: cardFloatIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card { padding: 34px; }

    .welcome-card::before,
    .card::before {
      content: "";
      position: absolute;
      top: -80px;
      left: -60px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(95, 208, 230, 0.12), rgba(95, 208, 230, 0));
      pointer-events: none;
    }

    .welcome-card::after,
    .card::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(157, 232, 245, 0.16), rgba(157, 232, 245, 0));
      pointer-events: none;
    }

    @keyframes cardFloatIn {
      0% { opacity: 0; transform: translateY(26px) scale(0.985); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .welcome-badge,
    .result-tag,
    .dimension-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }

    .welcome-badge,
    .result-tag {
      background: rgba(95,208,230,0.15);
      color: #1b7f92;
    }

    .dimension-badge {
      background: rgba(95,208,230,0.18);
      color: #157a8d;
      margin-bottom: 14px;
    }

    .welcome-title {
      margin: 18px 0 0;
      font-size: 48px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .reveal-line {
      display: block;
      opacity: 0;
      transform: translateY(24px);
      filter: blur(10px);
      animation: appleReveal 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .reveal-line:nth-child(2) { animation-delay: 0.22s; }

    .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(6px);
      animation: letterFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .letter.space { width: 0.32em; }

    @keyframes appleReveal {
      0% { opacity: 0; transform: translateY(24px) scale(0.985); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes letterFadeIn {
      0% { opacity: 0; transform: translateY(10px); filter: blur(6px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .welcome-subtitle,
    .subtitle,
    .result-desc {
      color: var(--muted);
      line-height: 1.85;
    }

    .welcome-subtitle {
      max-width: 560px;
      margin: 22px auto 30px;
      font-size: 17px;
    }

    .subtitle {
      text-align: center;
      margin: 14px 0 28px;
      font-size: 15px;
    }

    .quiz-title {
      margin: 0;
      font-size: 34px;
      text-align: center;
    }

    .start-btn,
    .answer-btn,
    .restart-btn,
    .ghost-btn {
      position: relative;
      display: inline-block;
      background: rgba(255,255,255,0.92);
      color: #111827;
      border: 1px solid #d8ebef;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .answer-btn {
      text-align: left;
      line-height: 1.65;
      padding: 16px 18px;
      overflow: hidden;
    }

    .answer-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -130%;
      width: 130%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(95,208,230,0.18), transparent);
      transition: transform 0.6s ease;
      transform: translateX(0);
      pointer-events: none;
    }

    .answer-btn:hover::before { transform: translateX(190%); }

    .start-btn:hover,
    .answer-btn:hover,
    .restart-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(17,24,39,0.12);
    }

    .progress {
      height: 10px;
      background: linear-gradient(180deg, rgba(231, 244, 247, 0.96), rgba(221, 239, 244, 0.96));
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9ae8f6 0%, #66d9ee 20%, #4ecfe5 40%, #78cfff 60%, #67b8ff 80%, #9ae8f6 100%);
      background-size: 240% 100%;
      animation: progressFlow 7s linear infinite;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px rgba(102, 217, 238, 0.28);
    }

    @keyframes progressFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 240% 50%; }
    }

    .question-box {
      padding: 28px;
      border-radius: 24px;
      background: #ffffff;
      border: 1px solid rgba(214, 238, 243, 1);
      box-shadow: 0 8px 24px rgba(20,60,80,0.06);
    }

    .question-number {
      font-size: 14px;
      color: #8a8f9a;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .answers {
      display: grid;
      gap: 14px;
    }

    .result {
      display: none;
      text-align: center;
      padding-top: 8px;
    }

    .result.show {
      display: block;
      animation: pageFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .result-card {
      padding: 34px 28px;
      border-radius: 28px;
      background: linear-gradient(180deg, #f5fdff, #ffffff);
      border: 1px solid #d9f0f5;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.72), 0 14px 34px rgba(40,110,130,0.08);
      margin-top: 14px;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: -70px;
      right: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(95,208,230,0.16), rgba(95,208,230,0));
      pointer-events: none;
    }

    .result-card::after {
      content: "";
      position: absolute;
      bottom: -80px;
      left: -40px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(140,214,255,0.12), rgba(140,214,255,0));
      pointer-events: none;
    }

    .result-animal-wrap {
      width: 136px;
      height: 136px;
      margin: 8px auto 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 12px 28px rgba(60,120,140,0.10);
    }

    .result-animal-wrap::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
    }

    .result-animal {
      font-size: 68px;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .result-title {
      font-size: 30px;
      margin: 0 0 14px;
    }

    .result-desc {
      font-size: 17px;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .score-chart {
      margin: 0 auto 26px;
      max-width: 640px;
      padding: 18px 20px;
      background: rgba(247,253,255,0.96);
      border: 1px solid #dbeff4;
      border-radius: 18px;
      text-align: left;
    }

    .score-chart-title {
      font-size: 15px;
      color: #56727c;
      margin-bottom: 14px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 70px 1fr 34px;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-row:last-child { margin-bottom: 0; }

    .score-label {
      font-size: 14px;
      color: #3f5560;
    }

    .score-track {
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(228,241,245,0.95), rgba(217,234,239,0.95));
      box-shadow: inset 0 1px 2px rgba(120,150,160,0.08);
    }

    .score-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .score-value {
      font-size: 14px;
      color: #4f6771;
      text-align: right;
    }

    .result-points {
      margin: 0 auto 26px;
      max-width: 640px;
      text-align: left;
      background: rgba(247,253,255,0.96);
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid #dbeff4;
      line-height: 1.8;
      color: #3f4a52;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .share-copy-note {
      margin-top: 12px;
      text-align: center;
      color: #6d8790;
      font-size: 13px;
      min-height: 18px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #7b9098;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .welcome-card,
      .reveal-line,
      .letter,
      .fade-out,
      .fade-in,
      .result.show,
      .bar {
        animation: none !important;
      }

      .reveal-line,
      .letter {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @media (max-width: 640px) {
      .page { padding: 14px; align-items: stretch; }
      .welcome-card { padding: 38px 20px; margin: auto 0; }
      .card { padding: 22px; margin: auto 0; }
      .welcome-title { font-size: 36px; }
      .quiz-title { font-size: 28px; }
      .welcome-subtitle,
      .subtitle,
      .result-desc,
      .result-points { font-size: 15px; }
      .question-text { font-size: 22px; }
      .answer-btn,
      .start-btn,
      .restart-btn,
      .ghost-btn {
        width: 100%;
        padding: 15px 16px;
        font-size: 15px;
      }
      .button-row { flex-direction: column; }
      .result-animal-wrap { width: 112px; height: 112px; }
      .result-animal { font-size: 54px; }
      .result-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="welcomePage" class="page">
    <div class="welcome-card">
      <div class="welcome-badge">✨ fun animal quiz</div>
      <h1 class="welcome-title" id="welcomeText"></h1>
      <div class="welcome-subtitle">
        回答 4 个轻松的小问题，看看你的隐藏气质更像哪种小动物。不是严肃测验，是一个可爱又有点准的互动网页。
      </div>
      <button class="start-btn" id="startBtn">点击进入开始测试</button>
    </div>
  </div>

  <div id="quizPage" class="page hidden">
    <div class="card">
      <h1 class="quiz-title">Ning 的小动物测试</h1>
      <div class="subtitle">选最像你的答案就好，最后会出现你的专属小动物结果。</div>

      <div class="progress">
        <div class="bar" id="progressBar"></div>
      </div>

      <div id="quizArea">
        <div class="question-box">
          <div class="question-number" id="questionNumber">第 1 题 / 共 4 题</div>
          <div class="dimension-badge">personality vibe</div>
          <div class="question-text" id="questionText"></div>
          <div class="answers" id="answersBox"></div>
        </div>
      </div>

      <div class="result" id="resultBox">
        <div class="result-card" id="resultCard">
          <div class="result-tag" id="resultTag">你的结果是</div>
          <div class="result-animal-wrap" id="resultAnimalWrap">
            <div class="result-animal" id="resultAnimal"></div>
          </div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-desc" id="resultDescription"></p>
          <div class="score-chart" id="scoreChart"></div>
          <div class="result-points" id="resultPoints"></div>
        </div>

        <div class="button-row">
          <button class="restart-btn" id="restartBtn">再测一次</button>
          <button class="ghost-btn" id="savePosterBtn">生成分享海报</button>
          <button class="ghost-btn" id="copyShareBtn">复制分享文案</button>
          <button class="ghost-btn" onclick="window.print()">打印 / 保存结果</button>
        </div>
        <div class="share-copy-note" id="shareCopyNote"></div>
      </div>

      <div class="footer-note">你可以继续自己改题目、改结果文案、改成完全属于你的版本。</div>
    </div>
  </div>

  <script>
    const SITE_URL = 'https://nc3465.github.io/ning-mbti-test/';

    const welcomeTextEl = document.getElementById('welcomeText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const savePosterBtn = document.getElementById('savePosterBtn');
    const copyShareBtn = document.getElementById('copyShareBtn');
    const shareCopyNote = document.getElementById('shareCopyNote');
    const welcomePage = document.getElementById('welcomePage');
    const quizPage = document.getElementById('quizPage');

    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const answersBox = document.getElementById('answersBox');
    const progressBar = document.getElementById('progressBar');
    const quizArea = document.getElementById('quizArea');
    const resultBox = document.getElementById('resultBox');
    const resultCard = document.getElementById('resultCard');
    const resultTag = document.getElementById('resultTag');
    const resultAnimalWrap = document.getElementById('resultAnimalWrap');
    const resultAnimal = document.getElementById('resultAnimal');
    const resultTitle = document.getElementById('resultTitle');
    const resultDescription = document.getElementById('resultDescription');
    const resultPoints = document.getElementById('resultPoints');
    const scoreChart = document.getElementById('scoreChart');

    function buildAnimatedLine(text, baseDelay) {
      return text
        .split('')
        .map(function (char, index) {
          const delay = baseDelay + index * 0.035;
          if (char === ' ') {
            return '<span class="letter space" style="animation-delay:' + delay + 's"></span>';
          }
          return '<span class="letter" style="animation-delay:' + delay + 's">' + char + '</span>';
        })
        .join('');
    }

    function renderWelcomeTitle() {
      welcomeTextEl.innerHTML =
        '<span class="reveal-line">' + buildAnimatedLine('欢迎来到', 0.12) + '</span>' +
        '<span class="reveal-line">' + buildAnimatedLine('Ning 的测试题～', 0.38) + '</span>';
    }

    const questions = [
      {
        text: '一个没有安排的下午，你最想怎么度过？',
        answers: [
          { text: '窝在安静角落，做自己的小事', type: 'cat' },
          { text: '约朋友出去，热热闹闹地玩', type: 'dog' },
          { text: '随便走走，顺便观察路上的灵感', type: 'fox' },
          { text: '晒太阳、吃点东西、轻轻松松地休息', type: 'rabbit' }
        ]
      },
      {
        text: '在别人眼里，你更像是哪一种气质？',
        answers: [
          { text: '安静、敏感、有一点距离感', type: 'cat' },
          { text: '直接、热情、很有感染力', type: 'dog' },
          { text: '聪明、特别、带一点神秘感', type: 'fox' },
          { text: '温柔、软乎乎、让人想靠近', type: 'rabbit' }
        ]
      },
      {
        text: '当你感觉压力很大时，你更会？',
        answers: [
          { text: '先躲起来，自己恢复能量', type: 'cat' },
          { text: '找人说说话，边说边好起来', type: 'dog' },
          { text: '分析一通，试图找到新的出口', type: 'fox' },
          { text: '需要舒服的环境和一点被照顾的感觉', type: 'rabbit' }
        ]
      },
      {
        text: '如果把你变成一个画面，你会更像？',
        answers: [
          { text: '雨天窗边，一盏灯，一点安静', type: 'cat' },
          { text: '晴天草地，一群人，一阵风', type: 'dog' },
          { text: '黄昏森林，带点光影和秘密', type: 'fox' },
          { text: '柔软被子，阳光，甜点和抱枕', type: 'rabbit' }
        ]
      }
    ];

    const results = {
      cat: {
        emoji: '🐱',
        title: '你是猫猫型人格',
        description: '你很敏感，也很有自己的节奏。你不一定总是热闹，但你有很强的感受力和边界感。你的魅力来自安静、细腻和只属于你自己的世界。',
        points: [
          '喜欢独处和安静的安全感',
          '对气氛和情绪变化很敏锐',
          '慢热，但认定之后会很真诚'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #f4f8ff, #ffffff)',
          border: '#dbe7f7',
          tagBg: '#ebf2ff',
          tagColor: '#5478b8',
          bars: ['#9fc1ff', '#7fa8ff'],
          orb: 'linear-gradient(180deg, #eef4ff, #dce8ff)'
        }
      },
      dog: {
        emoji: '🐶',
        title: '你是小狗型人格',
        description: '你有很强的生命力，也很容易把热情带给别人。你通常真实、直接、愿意投入关系，很多时候大家会因为你的存在而觉得轻松。',
        points: [
          '互动感强，很有感染力',
          '更容易在关系里获得能量',
          '表达比较直接，也很真诚'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #eefcff, #ffffff)',
          border: '#d7eff4',
          tagBg: '#e5f9fd',
          tagColor: '#2f8da3',
          bars: ['#74dced', '#42c6df'],
          orb: 'linear-gradient(180deg, #e0fbff, #c9f4fb)'
        }
      },
      fox: {
        emoji: '🦊',
        title: '你是小狐狸型人格',
        description: '你很会观察，也很有自己的想法和审美。你不喜欢太无聊的表达，总想看到事情更深一层的意义。你的魅力来自灵气、聪明和一点神秘。',
        points: [
          '直觉和观察力都很强',
          '喜欢特别、有层次的东西',
          '常常会想到别人没想到的角度'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #fff9f1, #ffffff)',
          border: '#f4e3cc',
          tagBg: '#fff1de',
          tagColor: '#ba7742',
          bars: ['#ffcf9b', '#f1a85f'],
          orb: 'linear-gradient(180deg, #fff1df, #ffe0bb)'
        }
      },
      rabbit: {
        emoji: '🐰',
        title: '你是小兔子型人格',
        description: '你柔软，但不是没有力量。你很在意舒适感、安全感和真心，也很懂得从小小的日常里获得快乐。你的魅力来自温柔、细腻和被珍惜的感觉。',
        points: [
          '需要舒服、稳定的环境',
          '很会感受细小的幸福',
          '温柔，也很珍惜真诚的人'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #fff7fb, #ffffff)',
          border: '#f1dce8',
          tagBg: '#fdebf4',
          tagColor: '#b86a91',
          bars: ['#f8bfd8', '#ee9ec2'],
          orb: 'linear-gradient(180deg, #ffeef5, #ffd8e8)'
        }
      }
    };

    let currentQuestion = 0;
    let scores = { cat: 0, dog: 0, fox: 0, rabbit: 0 };

    function showQuestion() {
      const q = questions[currentQuestion];
      questionNumber.textContent = '第 ' + (currentQuestion + 1) + ' 题 / 共 ' + questions.length + ' 题';
      questionText.textContent = q.text;
      answersBox.innerHTML = '';

      q.answers.forEach(function (answer) {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = answer.text;
        btn.addEventListener('click', function () {
          selectAnswer(answer.type);
        });
        answersBox.appendChild(btn);
      });

      progressBar.style.width = (currentQuestion / questions.length) * 100 + '%';
    }

    function selectAnswer(type) {
      scores[type] += 1;
      currentQuestion += 1;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function getFinalType() {
      let finalType = 'cat';
      let maxScore = -1;
      Object.keys(scores).forEach(function (type) {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
          finalType = type;
        }
      });
      return finalType;
    }

    function showResult() {
      progressBar.style.width = '100%';
      quizArea.style.display = 'none';
      resultBox.classList.add('show');
      shareCopyNote.textContent = '';

      const finalType = getFinalType();
      const detail = results[finalType];
      const theme = detail.theme;

      resultCard.style.background = theme.bg;
      resultCard.style.borderColor = theme.border;
      resultTag.style.background = theme.tagBg;
      resultTag.style.color = theme.tagColor;
      resultAnimalWrap.style.background = theme.orb;

      resultAnimal.textContent = detail.emoji;
      resultTitle.textContent = detail.title;
      resultDescription.textContent = detail.description;

      const maxScore = Math.max(scores.cat, scores.dog, scores.fox, scores.rabbit, 1);
      const scoreData = [
        { key: 'cat', label: '猫猫', value: scores.cat },
        { key: 'dog', label: '小狗', value: scores.dog },
        { key: 'fox', label: '小狐狸', value: scores.fox },
        { key: 'rabbit', label: '小兔子', value: scores.rabbit }
      ];

      scoreChart.innerHTML =
        '<div class="score-chart-title">你的得分分布</div>' +
        scoreData.map(function(item) {
          const width = (item.value / maxScore) * 100;
          const colors = results[item.key].theme.bars;
          return '<div class="score-row">' +
            '<div class="score-label">' + item.label + '</div>' +
            '<div class="score-track"><div class="score-fill" style="width:' + width + '%; background:linear-gradient(90deg,' + colors[0] + ',' + colors[1] + ');"></div></div>' +
            '<div class="score-value">' + item.value + '</div>' +
          '</div>';
        }).join('');

      resultPoints.innerHTML =
        '<strong>为什么会是这个结果：</strong><br>' +
        detail.points.map(function (point) {
          return '• ' + point;
        }).join('<br>');
    }

    function restartQuiz() {
      currentQuestion = 0;
      scores = { cat: 0, dog: 0, fox: 0, rabbit: 0 };
      quizArea.style.display = 'block';
      resultBox.classList.remove('show');
      progressBar.style.width = '0%';
      shareCopyNote.textContent = '';
      showQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function roundRect(ctx, x, y, width, height, radius, fill) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split('');
      let line = '';
      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          ctx.fillText(line, x, y);
          line = chars[i];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    startBtn.addEventListener('click', function () {
      welcomePage.classList.add('fade-out');
      setTimeout(function () {
        welcomePage.classList.add('hidden');
        welcomePage.classList.remove('fade-out');
        quizPage.classList.remove('hidden');
        quizPage.classList.add('fade-in');
        showQuestion();
      }, 520);
    });

    restartBtn.addEventListener('click', restartQuiz);

    savePosterBtn.addEventListener('click', function () {
      const finalType = getFinalType();
      const detail = results[finalType];

      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 1500;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 1500);
      gradient.addColorStop(0, '#e8fbff');
      gradient.addColorStop(1, '#ffffff');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1200, 1500);

      ctx.fillStyle = 'rgba(95,208,230,0.15)';
      ctx.beginPath();
      ctx.arc(190, 180, 180, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(1030, 1260, 210, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5fd0e6';
      ctx.font = 'bold 58px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Ning 的小动物测试', 600, 180);

      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      roundRect(ctx, 180, 250, 840, 860, 36, true);

      const orb = ctx.createLinearGradient(0, 320, 0, 560);
      if (finalType === 'cat') {
        orb.addColorStop(0, '#eef4ff');
        orb.addColorStop(1, '#dce8ff');
      } else if (finalType === 'dog') {
        orb.addColorStop(0, '#e0fbff');
        orb.addColorStop(1, '#c9f4fb');
      } else if (finalType === 'fox') {
        orb.addColorStop(0, '#fff1df');
        orb.addColorStop(1, '#ffe0bb');
      } else {
        orb.addColorStop(0, '#ffeef5');
        orb.addColorStop(1, '#ffd8e8');
      }
      ctx.fillStyle = orb;
      ctx.beginPath();
      ctx.arc(600, 430, 110, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '120px Arial';
      ctx.fillStyle = '#1f2430';
      ctx.fillText(detail.emoji, 600, 470);

      ctx.font = 'bold 54px Arial';
      ctx.fillStyle = '#1f2430';
      ctx.fillText(detail.title, 600, 620);

      ctx.font = '28px Arial';
      ctx.fillStyle = '#5f6f7a';
      wrapText(ctx, detail.description, 600, 700, 620, 42);

      ctx.fillStyle = '#4f6771';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('为什么会是这个结果', 600, 910);

      ctx.font = '26px Arial';
      detail.points.forEach(function(point, index) {
        ctx.fillText('• ' + point, 600, 970 + index * 42);
      });

      ctx.fillStyle = '#89a7af';
      ctx.font = '24px Arial';
      ctx.fillText('来测测你是什么小动物人格', 600, 1290);
      ctx.fillText(SITE_URL, 600, 1338);

      const link = document.createElement('a');
      link.download = 'ning-animal-result.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    copyShareBtn.addEventListener('click', async function () {
      const finalType = getFinalType();
      const detail = results[finalType];
      const text = '我测出来是 ' + detail.title + ' ' + detail.emoji + '\n来玩 Ning 的小动物测试～\n' + SITE_URL;
      try {
        await navigator.clipboard.writeText(text);
        shareCopyNote.textContent = '分享文案已复制，可以直接发给朋友啦。';
      } catch (error) {
        shareCopyNote.textContent = '复制失败了，你可以手动复制链接分享。';
      }
    });

    renderWelcomeTitle();
  </script>
</body>
</html>
