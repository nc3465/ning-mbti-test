<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ning 的小动物测试</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --text: #1f2430;
      --muted: #69707d;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.55);
      --shadow: 0 24px 70px rgba(31, 36, 48, 0.10);
      --purple: #a77dff;
      --pink: #f3a6d8;
      --peach: #ffd1a8;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      background: linear-gradient(135deg, #f7efff, #eef4ff, #fff1f7, #fdf4ea, #f2fff7);
      background-size: 260% 260%;
      animation: softGradientFlow 20s ease-in-out infinite;
    }

    @keyframes softGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hidden {
      display: none;
    }

    .fade-out {
      animation: pageFadeOut 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    .fade-in {
      animation: pageFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes pageFadeOut {
      0% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(1.015);
        filter: blur(8px);
      }
    }

    @keyframes pageFadeIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.99);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .welcome-card,
    .card {
      width: 100%;
      max-width: 760px;
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .welcome-card {
      text-align: center;
      padding: 56px 32px;
      animation: cardFloatIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card {
      padding: 34px;
    }

    .welcome-card::before,
    .card::before {
      content: "";
      position: absolute;
      top: -80px;
      left: -60px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(186, 152, 255, 0.20), rgba(186, 152, 255, 0));
      pointer-events: none;
    }

    .welcome-card::after,
    .card::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 170, 210, 0.18), rgba(255, 170, 210, 0));
      pointer-events: none;
    }

    @keyframes cardFloatIn {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(0.985);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .welcome-badge,
    .result-tag,
    .dimension-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }

    .welcome-badge,
    .result-tag {
      background: #f4ecff;
      color: #795bd6;
    }

    .dimension-badge {
      background: #eef5ff;
      color: #4a79c7;
      margin-bottom: 14px;
    }

    .welcome-title {
      margin: 18px 0 0;
      font-size: 48px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .reveal-line {
      display: block;
      opacity: 0;
      transform: translateY(24px);
      filter: blur(10px);
      animation: appleReveal 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .reveal-line:nth-child(2) {
      animation-delay: 0.22s;
    }

    .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(6px);
      animation: letterFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .letter.space {
      width: 0.32em;
    }

    @keyframes appleReveal {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.985);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes letterFadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .welcome-subtitle,
    .subtitle,
    .result-desc {
      color: var(--muted);
      line-height: 1.85;
    }

    .welcome-subtitle {
      max-width: 560px;
      margin: 22px auto 30px;
      font-size: 17px;
    }

    .subtitle {
      text-align: center;
      margin: 14px 0 28px;
      font-size: 15px;
    }

    .quiz-title {
      margin: 0;
      font-size: 34px;
      text-align: center;
    }

    .start-btn,
    .answer-btn,
    .restart-btn,
    .ghost-btn {
      border: none;
      border-radius: 18px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
    }

    .start-btn,
    .restart-btn {
      background: #111827;
      color: #fff;
      padding: 16px 28px;
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.9);
      color: #111827;
      border: 1px solid #e1deef;
      padding: 16px 28px;
    }

    .start-btn:hover,
    .answer-btn:hover,
    .restart-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.12);
    }

    .progress {
      height: 10px;
      background: rgba(235, 233, 243, 0.9);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c6a2ff, #f3a6d8, #ffd1a8, #f3a6d8, #c6a2ff);
      background-size: 220% 100%;
      animation: progressFlow 6s linear infinite;
      transition: width 0.35s ease;
    }

    @keyframes progressFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    .question-box {
      padding: 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(236, 236, 244, 1);
    }

    .question-number {
      font-size: 14px;
      color: #8a8f9a;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .answers {
      display: grid;
      gap: 14px;
    }

    .answer-btn {
      background: #faf8ff;
      color: var(--text);
      text-align: left;
      line-height: 1.65;
      padding: 16px 18px;
    }

    .result {
      display: none;
      text-align: center;
      padding-top: 8px;
    }

    .result.show {
      display: block;
      animation: pageFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .result-card {
      padding: 30px 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, #faf7ff, #ffffff);
      border: 1px solid #ece7ff;
      margin-top: 14px;
    }

    .result-animal {
      font-size: 56px;
      margin: 6px 0 8px;
    }

    .result-title {
      font-size: 30px;
      margin: 0 0 14px;
    }

    .result-desc {
      font-size: 17px;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .result-points {
      margin: 0 auto 26px;
      max-width: 640px;
      text-align: left;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid #efebf8;
      line-height: 1.8;
      color: #444;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #8a8f9a;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .welcome-card,
      .reveal-line,
      .letter,
      .fade-out,
      .fade-in,
      .result.show,
      .bar {
        animation: none !important;
      }

      .reveal-line,
      .letter {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
        align-items: stretch;
      }

      .welcome-card {
        padding: 38px 20px;
        margin: auto 0;
      }

      .card {
        padding: 22px;
        margin: auto 0;
      }

      .welcome-title {
        font-size: 36px;
      }

      .quiz-title {
        font-size: 28px;
      }

      .welcome-subtitle,
      .subtitle,
      .result-desc,
      .result-points {
        font-size: 15px;
      }

      .question-text {
        font-size: 22px;
      }

      .answer-btn,
      .start-btn,
      .restart-btn,
      .ghost-btn {
        width: 100%;
        padding: 15px 16px;
        font-size: 15px;
      }

      .button-row {
        flex-direction: column;
      }

      .result-animal {
        font-size: 48px;
      }

      .result-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="welcomePage" class="page">
    <div class="welcome-card">
      <div class="welcome-badge">✨ fun animal quiz</div>
      <h1 class="welcome-title" id="welcomeText"></h1>
      <div class="welcome-subtitle">
        回答 4 个轻松的小问题，看看你的隐藏气质更像哪种小动物。不是严肃测验，是一个可爱又有点准的互动网页。
      </div>
      <button class="start-btn" id="startBtn">点击进入开始测试</button>
    </div>
  </div>

  <div id="quizPage" class="page hidden">
    <div class="card">
      <h1 class="quiz-title">Ning 的小动物测试</h1>
      <div class="subtitle">选最像你的答案就好，最后会出现你的专属小动物结果。</div>

      <div class="progress">
        <div class="bar" id="progressBar"></div>
      </div>

      <div id="quizArea">
        <div class="question-box">
          <div class="question-number" id="questionNumber">第 1 题 / 共 4 题</div>
          <div class="dimension-badge">personality vibe</div>
          <div class="question-text" id="questionText"></div>
          <div class="answers" id="answersBox"></div>
        </div>
      </div>

      <div class="result" id="resultBox">
        <div class="result-card" id="resultCard">
          <div class="result-tag" id="resultTag">你的结果是</div>
          <div class="result-animal" id="resultAnimal"></div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-desc" id="resultDescription"></p>
          <div class="result-points" id="resultPoints"></div>
        </div>

        <div class="button-row">
          <button class="restart-btn" id="restartBtn">再测一次</button>
          <button class="ghost-btn" onclick="window.print()">打印 / 保存结果</button>
        </div>
      </div>

      <div class="footer-note">你可以继续自己改题目、改结果文案、改成完全属于你的版本。</div>
    </div>
  </div>

  <script>
    const welcomeTextEl = document.getElementById('welcomeText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const welcomePage = document.getElementById('welcomePage');
    const quizPage = document.getElementById('quizPage');

    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const answersBox = document.getElementById('answersBox');
    const progressBar = document.getElementById('progressBar');
    const quizArea = document.getElementById('quizArea');
    const resultBox = document.getElementById('resultBox');
    const resultCard = document.getElementById('resultCard');
    const resultTag = document.getElementById('resultTag');
    const resultAnimal = document.getElementById('resultAnimal');
    const resultTitle = document.getElementById('resultTitle');
    const resultDescription = document.getElementById('resultDescription');
    const resultPoints = document.getElementById('resultPoints');

    function buildAnimatedLine(text, baseDelay) {
      return text
        .split('')
        .map(function (char, index) {
          const delay = baseDelay + index * 0.035;
          if (char === ' ') {
            return '<span class="letter space" style="animation-delay:' + delay + 's"></span>';
          }
          return '<span class="letter" style="animation-delay:' + delay + 's">' + char + '</span>';
        })
        .join('');
    }

    function renderWelcomeTitle() {
      welcomeTextEl.innerHTML =
        '<span class="reveal-line">' + buildAnimatedLine('欢迎来到', 0.12) + '</span>' +
        '<span class="reveal-line">' + buildAnimatedLine('Ning 的测试题～', 0.38) + '</span>';
    }

    const questions = [
      {
        text: '一个没有安排的下午，你最想怎么度过？',
        answers: [
          { text: '窝在安静角落，做自己的小事', type: 'cat' },
          { text: '约朋友出去，热热闹闹地玩', type: 'dog' },
          { text: '随便走走，顺便观察路上的灵感', type: 'fox' },
          { text: '晒太阳、吃点东西、轻轻松松地休息', type: 'rabbit' }
        ]
      },
      {
        text: '在别人眼里，你更像是哪一种气质？',
        answers: [
          { text: '安静、敏感、有一点距离感', type: 'cat' },
          { text: '直接、热情、很有感染力', type: 'dog' },
          { text: '聪明、特别、带一点神秘感', type: 'fox' },
          { text: '温柔、软乎乎、让人想靠近', type: 'rabbit' }
        ]
      },
      {
        text: '当你感觉压力很大时，你更会？',
        answers: [
          { text: '先躲起来，自己恢复能量', type: 'cat' },
          { text: '找人说说话，边说边好起来', type: 'dog' },
          { text: '分析一通，试图找到新的出口', type: 'fox' },
          { text: '需要舒服的环境和一点被照顾的感觉', type: 'rabbit' }
        ]
      },
      {
        text: '如果把你变成一个画面，你会更像？',
        answers: [
          { text: '雨天窗边，一盏灯，一点安静', type: 'cat' },
          { text: '晴天草地，一群人，一阵风', type: 'dog' },
          { text: '黄昏森林，带点光影和秘密', type: 'fox' },
          { text: '柔软被子，阳光，甜点和抱枕', type: 'rabbit' }
        ]
      }
    ];

    const results = {
      cat: {
        emoji: '🐱',
        title: '你是猫猫型人格',
        description: '你很敏感，也很有自己的节奏。你不一定总是热闹，但你有很强的感受力和边界感。你的魅力来自安静、细腻和只属于你自己的世界。',
        points: [
          '喜欢独处和安静的安全感',
          '对气氛和情绪变化很敏锐',
          '慢热，但认定之后会很真诚'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #f7f1ff, #ffffff)',
          border: '#eadfff',
          tagBg: '#f2eaff',
          tagColor: '#7a5ad8'
        }
      },
      dog: {
        emoji: '🐶',
        title: '你是小狗型人格',
        description: '你有很强的生命力，也很容易把热情带给别人。你通常真实、直接、愿意投入关系，很多时候大家会因为你的存在而觉得轻松。',
        points: [
          '互动感强，很有感染力',
          '更容易在关系里获得能量',
          '表达比较直接，也很真诚'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #fff6ee, #ffffff)',
          border: '#ffe6cf',
          tagBg: '#fff1e2',
          tagColor: '#c9793c'
        }
      },
      fox: {
        emoji: '🦊',
        title: '你是小狐狸型人格',
        description: '你很会观察，也很有自己的想法和审美。你不喜欢太无聊的表达，总想看到事情更深一层的意义。你的魅力来自灵气、聪明和一点神秘。',
        points: [
          '直觉和观察力都很强',
          '喜欢特别、有层次的东西',
          '常常会想到别人没想到的角度'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #fff7ef, #ffffff)',
          border: '#ffe5cf',
          tagBg: '#fff0df',
          tagColor: '#c96d36'
        }
      },
      rabbit: {
        emoji: '🐰',
        title: '你是小兔子型人格',
        description: '你柔软，但不是没有力量。你很在意舒适感、安全感和真心，也很懂得从小小的日常里获得快乐。你的魅力来自温柔、细腻和被珍惜的感觉。',
        points: [
          '需要舒服、稳定的环境',
          '很会感受细小的幸福',
          '温柔，也很珍惜真诚的人'
        ],
        theme: {
          bg: 'linear-gradient(180deg, #fff4f8, #ffffff)',
          border: '#ffddea',
          tagBg: '#ffeaf2',
          tagColor: '#cc6c95'
        }
      }
    };

    let currentQuestion = 0;
    let scores = {
      cat: 0,
      dog: 0,
      fox: 0,
      rabbit: 0
    };

    function showQuestion() {
      const q = questions[currentQuestion];
      questionNumber.textContent = '第 ' + (currentQuestion + 1) + ' 题 / 共 ' + questions.length + ' 题';
      questionText.textContent = q.text;
      answersBox.innerHTML = '';

      q.answers.forEach(function (answer) {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = answer.text;
        btn.addEventListener('click', function () {
          selectAnswer(answer.type);
        });
        answersBox.appendChild(btn);
      });

      progressBar.style.width = (currentQuestion / questions.length) * 100 + '%';
    }

    function selectAnswer(type) {
      scores[type] += 1;
      currentQuestion += 1;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function getFinalType() {
      let finalType = 'cat';
      let maxScore = -1;

      Object.keys(scores).forEach(function (type) {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
          finalType = type;
        }
      });

      return finalType;
    }

    function showResult() {
      progressBar.style.width = '100%';
      quizArea.style.display = 'none';
      resultBox.classList.add('show');

      const finalType = getFinalType();
      const detail = results[finalType];

      resultCard.style.background = detail.theme.bg;
      resultCard.style.borderColor = detail.theme.border;
      resultTag.style.background = detail.theme.tagBg;
      resultTag.style.color = detail.theme.tagColor;

      resultAnimal.textContent = detail.emoji;
      resultTitle.textContent = detail.title;
      resultDescription.textContent = detail.description;
      resultPoints.innerHTML =
        '<strong>为什么会是这个结果：</strong><br>' +
        detail.points.map(function (point) {
          return '• ' + point;
        }).join('<br>') +
        '<br><br><strong>你的得分分布：</strong><br>' +
        '猫猫 ' + scores.cat + ' / 小狗 ' + scores.dog + ' / 小狐狸 ' + scores.fox + ' / 小兔子 ' + scores.rabbit;
    }

    function restartQuiz() {
      currentQuestion = 0;
      scores = {
        cat: 0,
        dog: 0,
        fox: 0,
        rabbit: 0
      };
      quizArea.style.display = 'block';
      resultBox.classList.remove('show');
      progressBar.style.width = '0%';
      showQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    startBtn.addEventListener('click', function () {
      welcomePage.classList.add('fade-out');

      setTimeout(function () {
        welcomePage.classList.add('hidden');
        welcomePage.classList.remove('fade-out');
        quizPage.classList.remove('hidden');
        quizPage.classList.add('fade-in');
        showQuestion();
      }, 520);
    });

    restartBtn.addEventListener('click', restartQuiz);

    renderWelcomeTitle();
  </script>
</body>
</html>
